name: build-card-images

# Build the two card images and push them to GitHub's container registry
# (ghcr.io). They become public because this repository is public.
#   ghcr.io/<owner>/card-images-art:<date>   and :latest
#   ghcr.io/<owner>/card-images-train:<date> and :latest

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.art'
      - 'Dockerfile.train'
      - 'scripts/**'
      - 'tools/**'
      - '.github/workflows/build.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: art
            dockerfile: Dockerfile.art
          - name: train
            dockerfile: Dockerfile.train
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # These images are big (CUDA + torch + Blender + llama.cpp). The GitHub
      # runner ships ~14 GB free; drop the preinstalled toolchains we never use
      # so the build has room.
      - name: Free runner disk space
        run: |
          echo "before:"; df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/node_modules
          sudo docker image prune -af || true
          echo "after:"; df -h /

      - name: Date tag
        id: tag
        run: echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Lowercase owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/card-images-${{ matrix.name }}:${{ steps.tag.outputs.date }}
            ghcr.io/${{ steps.owner.outputs.owner }}/card-images-${{ matrix.name }}:latest
          provenance: false
